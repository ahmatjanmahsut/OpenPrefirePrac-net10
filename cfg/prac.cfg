// ============================================================
// 跑图训练服配置(cs3 / 端口 27025)
// 目标:玩家进服即处于训练状态(等同 MatchZy 练习模式)
// 由 server.cfg 在每次地图加载后自动 exec
//
// 注意:启动参数含 "+game_alias competitive",会覆盖部分 convar,
//      故本文件把关键项统一放在末尾,确保最终生效。
// ============================================================

// ---------- 1. 训练环境开关 ----------
sv_cheats 1
sv_infinite_ammo 1
sv_showimpacts 1
sv_showimpacts_time 10
buddha 1
buddha_ignore_bots 1
buddha_reset_hp 100

// ---------- 2. 投掷物:5 颗 + 轨迹预览 ----------
ammo_grenade_limit_total 5
ammo_grenade_limit_flashbang 5
sv_grenade_trajectory_prac_pipreview 1
sv_grenade_trajectory_prac_trailtime 6
weapon_auto_cleanup_time 15
weapon_max_before_cleanup 30

// ---------- 3. 购买与金钱:随处买、钱无限 ----------
mp_buy_anywhere 1
mp_buytime 999999
mp_buy_allow_grenades 1
mp_maxmoney 9999999
mp_startmoney 9999999
mp_weapons_allow_typecount -1

// ---------- 4. 出生装备:甲 + 主武器 + 全套投掷物 ----------
mp_free_armor 2
mp_defuser_allocation 2
mp_ct_default_primary weapon_m4a1
mp_t_default_primary weapon_ak47
mp_ct_default_grenades "weapon_incgrenade weapon_hegrenade weapon_smokegrenade weapon_flashbang weapon_decoy"
mp_t_default_grenades "weapon_molotov weapon_hegrenade weapon_smokegrenade weapon_flashbang weapon_decoy"

// ---------- 5. 死亡立即重生(练习核心) ----------
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_respawnwavetime_ct 0
mp_respawnwavetime_t 0

// ---------- 6. 不掉落(免得满地捡枪) ----------
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_defuser 0
mp_death_drop_taser 0
mp_drop_knife_enable 1

// ---------- 7. 无回合压力 ----------
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_maxrounds 999
mp_overtime_enable 0
mp_match_can_clinch 0
mp_team_intro_time 0
mp_warmup_end
mp_force_pick_time 0

// ---------- 8. 团队与交流 ----------
mp_limitteams 0
mp_autoteambalance 0
mp_teammates_are_enemies 0
mp_solid_teammates 2
mp_autokick 0
mp_tkpunish 0
mp_forcecamera 0
sv_deadtalk 1
sv_full_alltalk 1
sv_ignoregrenaderadio 0

// ---------- 9. Bot:交给 prefire 插件生成训练目标 ----------
bot_quota 0
bot_quota_mode normal
bot_join_after_player 0

// ============================================================
// 末尾再锁一次关键项(防止被 game_alias/换图重置)
// ============================================================
sv_cheats 1
sv_infinite_ammo 1
mp_buy_anywhere 1
mp_buytime 999999
mp_maxmoney 9999999
mp_startmoney 9999999
mp_free_armor 2
mp_freezetime 0
mp_roundtime 60
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_respawnwavetime_ct 0
mp_respawnwavetime_t 0
mp_limitteams 0
mp_autoteambalance 0
mp_forcecamera 0
sv_full_alltalk 1
buddha 1
bot_quota 0

echo "================================================"
echo " 跑图训练服已就绪(训练模式)"
echo " 聊天框输入 !prefire 打开训练菜单(中文)"
echo " 快捷: !prefire prac 1 开始 | !prefire map de_mirage 换图 | !prefire df 3 难度"
echo "================================================"
